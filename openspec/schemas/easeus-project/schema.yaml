    \ 和当前规则快照。\n使用 openspec_wizard MCP 先查询 opendeepwiki__<工具名>，再 codegraph__<工具名>，最后核实当前文件。\n### 交互与产物语言\n使用简体中文交互和编写自然语言产物；命令、标识符与固定标记保持兼容。\n\
    \n### 真实 TDD\n新增或修改的可单测行为与缺陷修复执行真实 Red → Green → Refactor，记录实际失败与通过证据，不伪造历史 Red。\n\n### 新增生产代码单测行覆盖率\n仅新增自有生产代码的单元测试行覆盖率不低于\
