  requires:
  - proposal
- id: tasks
  generates: tasks.md
  description: Implementation checklist with trackable tasks
  template: tasks.md
  instruction: "Create the task list that breaks down the implementation work.\n\nBefore writing tasks, check design.md\
    \ for Open Questions. If any of them\nwould change what gets built, resolve them with the user first - do not\n\
    bake an unstated assumption into the task list.\n\n**IMPORTANT: Follow the template below exactly.** The apply\
    \ phase parses\ncheckbox format to track progress. A box holding only `x` counts as done,\nupper or lower case\
    \ and with any spacing, so `- [ x]` is done too. Every\nother marker, including `- [~]`, `- [-]` and an empty\
    \ `- []`, reads as\nunfinished. A line with no checkbox is not tracked at all.\n\nGuidelines:\n- Group related\
    \ tasks under ## numbered headings\n- Each task MUST be a checkbox: `- [ ] X.Y Task description`\n- Tasks should\
    \ be small enough to complete in one session\n- Order tasks by dependency (what must be done first?)\n- Each\
    \ task MUST state how to verify completion (a test, command,\n  observable behavior, or delivered artifact).\
    \ Put the verification in\n  that task's checkbox description. Use a separate verification task only\n  when\
    \ it checks broader integration or system behavior that spans\n  multiple implementation tasks.\n- Each task\
    \ group MUST land the tests and documentation its own work\n  calls for. Do NOT collect testing or documentation\
    \ into a final group -\n  when a late group first exercises work from an early one, the failures\n  cascade\
    \ back through every group in between and force rework. A group\n  whose work calls for neither, such as scaffolding\
    \ or dependency setup,\n  carries neither. A final group is for integration checks only, not for\n  the tests\
    \ and docs an earlier group owed.\n\nExample:\n```\n# Tasks\n\n## 1. Setup\n\n- [ ] 1.1 Create new module structure\
    \ and verify expected files are present\n- [ ] 1.2 Add dependencies to package.json and verify package installation\
    \ succeeds\n\n## 2. Core Implementation\n\n- [ ] 2.1 Implement data export function and verify the export test\
    \ passes\n- [ ] 2.2 Add CSV formatting utilities and verify unit tests cover quoting and delimiters\n- [ ] 2.3\
    \ Document the export API in docs/export.md and verify the documented command runs as written\n```\n\nReference\
    \ specs for what needs to be built, design for how to build it.\n\n<!-- REPO-SDD-OPENSPEC:RULES:START -->\n\
