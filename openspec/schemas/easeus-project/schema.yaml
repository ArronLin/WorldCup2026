  requires:
  - specs
  - design
apply:
  requires:
  - tasks
  tracks: tasks.md
  instruction: 'Read context files, work through pending tasks, mark complete as you go.

    Pause if you hit blockers or need clarification.


    使用简体中文交互和记录自然语言内容，保留 OpenSpec 固定标记、命令、标识符及任务复选框格式。本文件是未来实施阶段的执行指令，不是业务需求或额外业务文档；本次模板适配本身不授权实施、写文件、运行命令或测试。


    实施开始时，使用所选变更实际返回的 schema、planningHome、changeRoot、actionContext、contextFiles、任务与状态，读取全部上下文文件及当前有效项目规范。项目规范尚未落盘时明确缺失，不能将评审草稿描述为已安装配置。保留现有自定义产物和用户未提交内容。遵循本次有效规则与已采纳
    Agent 约定；共享 AGENTS.md/CLAUDE.md 中另一框架的受管区段不适用，不加载其规范、Preset、专属约定或报告入口。


    保留 CLI 控制的 blocked、ready、all_done、missingArtifacts 与进度语义。context 和 operationGuidance 不能作为完成证据或绕过阻塞的依据。缺少必要产物、需求不明确，或出现会改变范围、验收、兼容性和技术方案的问题时，记录具体阻塞及受影响任务，暂停相关实施并澄清；不得静默缩减、延后或豁免指定行为。


    开始修改前核实当前源码及测试，记录来源与适用版本。先用 OpenDeepWiki 理解背景，再用 CodeGraph 定位实现和调用关系；版本不明、未命中或路径错配时用 repo_read 核对。不能据未命中推断文件不存在，也不能将现状缺陷固化为期望。检查实际工作区与规划基线差异；基线漂移或已有未提交内容影响统计时，先更新可追溯比较方案，不能覆盖用户工作或任意选取有利基线。


    按功能确认自有生产范围、排除理由与新增路径，默认参考 src/**/*.js 和 netlify/functions/**/*.mjs。修改生产代码前保存明确基线、相关源码清单与哈希。补齐 reporting 通用契约需要的生产包含/排除项、测试源码清单、真实套件分类、实际命令、结果和覆盖率格式及独立输出位置；当前能力缺口作为
    tasks 中的实际工作完成并验证，不能根据现有脚本存在宣称适配就绪。


    逐项处理未完成任务。新增或修改的可单测行为及缺陷修复执行真实 Red → Green → Refactor：先编写调用真实生产逻辑且能识别错误行为的断言，实际发现并执行测试，确认因目标行为不符失败；再最小实现并通过，随后重构与复跑。每阶段记录实际命令、时间、退出码、用例身份、失败断言或通过结果、测试及生产源码哈希和原始证据位置，核对断言变化。不得用占位成功、恒真断言、mock
    掉核心逻辑、静默跳过或环境故障代替验证。历史 Red 缺失保持缺失，补充反向验证不能改写历史。


    关键控制逻辑执行可恢复的反向验证或适用变异测试，记录目标错误、捕获它的测试及实际结果；恢复临时变更后核对源码并复跑相关测试。测试、文档与过程证据随各自实施任务完成，不集中留到最后。


    维护稳定需求 ID、场景 ID、生产逻辑、测试源码路径、用例身份、关键断言与实际执行记录之间的映射。需求改名或拆分时保留可追溯关系，不能只按显示标题猜测匹配。无行为变化且 skip_specs 生效时关联真实任务验收目标，不为报告新增业务需求。


    采集真实 unit、integration、e2e 结果并分别分类；测试框架名称不能代替套件性质。按已配置适配器提供 unified/junit/trx 之一的结果，以及 unified/lcov/cobertura
    之一的覆盖率；原生格式需要转换时先验证转换正确，报告核心保持通用。测试源码清单必须能核实断言变化。保存原始数据、采集命令、源码和结果哈希，避免旧报告或不同工作区结果混入本功能。


    新增行单测覆盖率仅统计相对功能基线新增的自有生产可执行行，包含未导入和未命中的新增行。核对最终源码与采集源码一致，按去重后的总覆盖新增可执行行数 / 总新增可执行行数，以未舍入汇总比值 >= 0.8 判定。不得平均文件百分比，不要求存量或全项目达到
    80%，不得用集成或端到端覆盖率替代。无新增可执行行时记录不适用及依据；缺少基线、源码或采集数据时记录缺失，不能记为不适用或通过。


    按 design/tasks 约定的位置生成本功能新增行单测覆盖率 HTML 与需求/TDD HTML。前者展示范围、基线、分子分母、未覆盖行和判定证据；后者展示稳定需求/场景映射、实际执行状态、测试源码/断言关联及真实
    Red/Green/Refactor 证据。两者如实展示缺失、失败、跳过、未执行及有依据的不适用，并验证可打开、证据链接可解析、哈希可核对、汇总与原始结果一致。报告生成成功不能替代行为验收通过；不直接沿用历史功能或另一框架入口。


    使用当前仓库核实的验证入口。现有 npm test、npm run build、npm run test:e2e 和 npm run test:coverage 只作为工程入口参考；根据本功能已配置的采集参数执行并记录真实结果，不假定已有历史报告命令符合通用契约。需要端到端验证时先从当前工作区构建，确认
    4173 预览服务提供本仓库当前产物。语言相关场景显式控制初始语言并断言实际切换结果；AI 相关验证明确覆盖 mock 界面、BYOK 或 Netlify Function 中哪条真实路径，界面演示不能证明服务端行为。


    只有任务指定行为、交付与验证证据全部满足后，才将对应 - [ ] 改为 - [x]。部分实现、失败、跳过、未执行、缺证据或未解决采集缺口均不能勾选完成。保留失败记录并说明影响，不以减少范围、修改断言迎合错误行为或移除新增行来通过门槛。


    结束或暂停时，报告实际完成与剩余任务、执行过的验证及其结果、基线与范围、新增行单测覆盖率判定、两类 HTML 位置及证据缺口。完成检查核对所有需求/场景或任务验收映射、TDD 证据、反向验证与恢复、覆盖率数据一致性及报告真实性。不得编造测试通过、覆盖率或历史
    Red，不以 CLI 文件存在状态代替实施完成；满足全部要求后再按当前 OpenSpec 工作流处理后续归档。


